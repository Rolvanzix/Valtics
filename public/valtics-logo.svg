<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05051a" />
      <stop offset="100%" stop-color="#000008" />
    </linearGradient>
    <linearGradient id="valtics-left-wing" x1="36" y1="48" x2="105" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8A20FF" />
      <stop offset="40%" stop-color="#7B1AF7" />
      <stop offset="75%" stop-color="#6010F0" />
      <stop offset="100%" stop-color="#3C08A6" />
    </linearGradient>
    <linearGradient id="valtics-fold-shadow" x1="90" y1="120" x2="114" y2="156" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#140228" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#2D0654" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#550E8C" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="valtics-ray-1" x1="92" y1="152" x2="142" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6010F0" />
      <stop offset="35%" stop-color="#8A20FF" />
      <stop offset="70%" stop-color="#D82AA8" />
      <stop offset="100%" stop-color="#E83DB8" />
    </linearGradient>
    <linearGradient id="valtics-ray-2" x1="108" y1="142" x2="162" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D82AA8" />
      <stop offset="45%" stop-color="#F25E68" />
      <stop offset="75%" stop-color="#FF8A20" />
      <stop offset="100%" stop-color="#FFA245" />
    </linearGradient>
    <linearGradient id="valtics-ray-3" x1="124" y1="128" x2="178" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8A20" />
      <stop offset="40%" stop-color="#FF9E3B" />
      <stop offset="80%" stop-color="#FFB35C" />
      <stop offset="100%" stop-color="#FFCD85" />
    </linearGradient>
  </defs>

  <!-- 1. Left descending sweeping ribbon arm -->
  <path
    d="M32 48 C 45 48, 62 50, 68 66 L 102 142 C 104 148, 100 156, 92 158 C 82 160, 72 153, 67 141 L 34 70 C 31 63, 28 53, 32 48 Z"
    fill="url(#valtics-left-wing)"
  />

  <!-- 2. Ribbon bottom loop wrap / fold shadow -->
  <path
    d="M67 141 C 74 156, 92 161, 107 150 C 117 142, 120 128, 112 116 L 98 92 C 96 89, 91 89, 89 94 L 80 114 C 73 126, 70 134, 67 141 Z"
    fill="url(#valtics-fold-shadow)"
  />

  <!-- 3. Ray 1: Inner Ascending Wing (Magenta-Violet) -->
  <path
    d="M96 150 L 138 60 C 142 52, 152 50, 158 56 C 163 61, 163 70, 157 78 L 114 162 C 109 168, 98 166, 94 158 C 93 155, 94 152, 96 150 Z"
    fill="url(#valtics-ray-1)"
  />

  <!-- 4. Ray 2: Middle Ascending Wing (Magenta-Orange) -->
  <path
    d="M112 136 L 154 54 C 158 46, 168 44, 174 50 C 180 55, 179 65, 174 72 L 132 154 C 127 160, 118 161, 113 154 C 110 149, 109 142, 112 136 Z"
