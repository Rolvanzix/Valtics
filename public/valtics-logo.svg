  />

  <!-- 5. Ray 3: Outer Ascending Wing (Orange-Gold) -->
  <path
    d="M130 118 L 166 66 C 170 60, 178 58, 184 64 C 189 69, 189 77, 184 83 L 150 142 C 146 148, 137 148, 133 142 C 129 135, 128 123, 130 118 Z"
